# ==============================================================================
# Nginx Reverse Proxy Configuration for rdphiro (Optional)
# Only needed if you run multiple websites on the same Lightsail instance.
# If rdphiro is the only app on this instance, you DO NOT need Nginx.
# ==============================================================================

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]80;
    server_name rdphiro.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rdphiro.yourdomain.com;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/rdphiro.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rdphiro.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Allow large file uploads through Files tab
    client_max_body_size 500M;

    location / {
        # Proxy to rdphiro local port (e.g. 4430)
        proxy_pass http://127.0.0.1:4430;
        proxy_http_version 1.1;

        # WebSocket support (Crucial for remote desktop, terminal and agents!)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout extension (prevent idle sessions from disconnecting)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 90s;
        proxy_buffering off;
    }
}
